name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-orka-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.4

      - name: Validate repository and pinned chart
        run: deploy/scripts/validate.sh

      - name: Render supported configurations
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rendered"
          deploy/scripts/render.sh --output "$RUNNER_TEMP/rendered/base.yaml"
          deploy/scripts/render.sh \
            --values deploy/values-actions.yaml \
            --output "$RUNNER_TEMP/rendered/actions.yaml"
          deploy/scripts/render.sh \
            --allow-scheduled \
            --values deploy/values-scheduled.yaml \
            --output "$RUNNER_TEMP/rendered/scheduled.yaml"

      - name: Assert deployment contracts
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/rendered/base.yaml"
          actions="$RUNNER_TEMP/rendered/actions.yaml"
          scheduled="$RUNNER_TEMP/rendered/scheduled.yaml"

          grep -Fq 'suspend: true' "$base"
          grep -Fq 'suspend: false' "$scheduled"
          grep -Fq -- '-analysis-runtime=orka-container' "$base"
          grep -Fq 'automountServiceAccountToken: true' "$base"
          grep -Fq 'name: ORKA_API_TOKEN_FILE' "$base"
          grep -Fq 'value: /var/run/secrets/kubernetes.io/serviceaccount/token' "$base"
          if grep -Eq '^[[:space:]]*- name: ORKA_API_TOKEN$' "$base"; then
            echo 'base render uses a static Orka API token' >&2
            exit 1
          fi
          grep -Fq 'resources: ["tasks"]' "$base"
          grep -Fq 'resources: ["configmaps"]' "$base"
          grep -Fq 'kind: ValidatingAdmissionPolicy' "$base"
          if grep -Fq 'name: ACTIONS_ENABLED' "$base"; then
            echo 'base render enables write actions' >&2
            exit 1
          fi

          grep -Fq 'name: ACTIONS_ENABLED' "$actions"
          grep -Fq 'value: "true"' "$actions"
          grep -Fq 'app.kubernetes.io/component: orka-fix-runtime' "$actions"
          grep -Fq 'name: ORKA_API_TOKEN_FILE' "$actions"
          if grep -Eq '^[[:space:]]*- name: ORKA_API_TOKEN$' "$actions"; then
            echo 'actions render uses a static Orka API token' >&2
            exit 1
          fi

      - name: Assert timeouts, placement, and immutable tags
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path('.')
          project = (root / 'project.yaml').read_text()
          values = (root / 'deploy/values.yaml').read_text()
          actions = (root / 'deploy/values-actions.yaml').read_text()

          def duration_seconds(value):
              total = 0
              for number, unit in re.findall(r'(\d+)([hms])', value):
                  total += int(number) * {'h': 3600, 'm': 60, 's': 1}[unit]
              return total

          ai_timeout = re.search(r'(?m)^  timeout: (\S+)$', project).group(1)
          task_timeout = re.search(r'(?m)^    taskTimeout: (\S+)$', values).group(1)
          if duration_seconds(task_timeout) <= duration_seconds(ai_timeout):
              raise SystemExit('analyzer Task timeout must exceed AI timeout')

          if not re.search(r'(?m)^    nodeSelector:\n      agentpool: \S+$', values):
              raise SystemExit('analyzer placement does not select an agentpool')
          placement = re.search(r'(?ms)^    nodeSelector:\n(?P<body>(?:      .*\n)+)', values).group('body')
          if re.search(r'gpu|nvidia|h100|a100|accelerator', placement, re.I):
              raise SystemExit('analyzer placement targets an accelerator')

          for path, text in [('deploy/values.yaml', values), ('deploy/values-actions.yaml', actions)]:
              for tag in re.findall(r'(?m)^\s*tag:\s*(\S+)\s*$', text):
                  if tag in {'main', 'latest'} or re.fullmatch(r'v\d+', tag):
                      raise SystemExit(f'{path} contains mutable tag {tag}')
                  if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag):
                      raise SystemExit(f'{path} contains non-semver image tag {tag}')
          PY

      - name: Check scripts and repository Secret boundaries
        run: |
          set -euo pipefail
          for script in deploy/scripts/*.sh deploy/orka/*.sh; do
            bash -n "$script"
          done
          if grep -RIl '^kind:[[:space:]]*Secret[[:space:]]*$' \
            --include='*.yaml' --include='*.yml' . | grep -q .; then
            echo 'Committed Kubernetes Secret manifest found' >&2
            exit 1
          fi
          test ! -e data
          test ! -e deploy/.rendered
          test ! -e deploy/evidence

      - name: Check Markdown links and referenced paths
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import urllib.parse

          root = pathlib.Path('.').resolve()
          errors = []
          link_re = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          for doc in root.rglob('*.md'):
              if '.git' in doc.parts:
                  continue
              for raw in link_re.findall(doc.read_text()):
                  target = raw.strip().split()[0].strip('<>')
                  if not target or target.startswith(('#', 'http://', 'https://', 'mailto:')):
                      continue
                  path_text = urllib.parse.unquote(target.split('#', 1)[0])
                  resolved = (doc.parent / path_text).resolve()
                  try:
                      resolved.relative_to(root)
                  except ValueError:
                      errors.append(f'{doc}: link escapes repository: {target}')
                      continue
                  if not resolved.exists():
                      errors.append(f'{doc}: missing link target: {target}')

          required = [
              'README.md', 'LICENSE', 'AGENTS.md', 'project.yaml',
              'prompts/system.md', 'skills', 'deploy/README.md',
              'deploy/versions.env', 'deploy/values.yaml',
              'deploy/values-actions.yaml', 'deploy/values-scheduled.yaml',
              'deploy/orka/README.md', 'deploy/orka/opencode-agent.yaml',
              'deploy/orka/versions.env', 'deploy/orka/values.yaml',
              'deploy/orka/install.sh', 'deploy/orka/validate.sh',
              'deploy/orka/package-source.sh', 'deploy/orka/upgrade.sh',
              'deploy/orka/uninstall.md', 'deploy/orka/create-agent-secret.sh',
              'deploy/orka/verify-agent.sh',
              'deploy/scripts/preflight.sh', 'deploy/scripts/render.sh',
              'deploy/scripts/install.sh', 'deploy/scripts/create-secrets.sh',
              'deploy/scripts/run-once.sh', 'deploy/scripts/validate.sh',
              'deploy/scripts/verify-live.sh',
          ]
          for name in required:
              if not (root / name).exists():
                  errors.append(f'missing required path: {name}')
          if errors:
              raise SystemExit('\n'.join(errors))
          PY

  orka-source-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.4

      - name: Check out pinned Orka source
        run: |
          set -euo pipefail
          source deploy/orka/versions.env
          [[ "$ORKA_MINIMUM_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test -z "$ORKA_CHART_VERSION"
          test -z "$ORKA_CHART_DIGEST"
          git init "$RUNNER_TEMP/orka"
          git -C "$RUNNER_TEMP/orka" remote add origin https://github.com/orka-agents/orka.git
          git -C "$RUNNER_TEMP/orka" fetch --depth=1 origin "$ORKA_MINIMUM_COMMIT"
          git -C "$RUNNER_TEMP/orka" checkout --detach FETCH_HEAD

      - name: Package and inspect exact source chart
        run: |
          set -euo pipefail
          deploy/orka/package-source.sh \
            --source-dir "$RUNNER_TEMP/orka" \
            --output-dir "$RUNNER_TEMP/chart"
          chart=$(find "$RUNNER_TEMP/chart" -maxdepth 1 -name 'orka-*.tgz' -print -quit)
          test -n "$chart"
          echo "chart=$chart" >> "$GITHUB_ENV"
          helm lint "$chart"
          helm show crds "$chart" > "$RUNNER_TEMP/crds.yaml"
          mapfile -t actual_crds < <(awk '$1 == "name:" && $2 ~ /\.orka\.ai$/ {print $2}' "$RUNNER_TEMP/crds.yaml" | sort -u)
          mapfile -t expected_crds < <(source deploy/orka/lib.sh; printf '%s\n' "${EXPECTED_CRDS[@]}" | sort)
          test "${#actual_crds[@]}" -eq 12
          diff -u <(printf '%s\n' "${expected_crds[@]}") <(printf '%s\n' "${actual_crds[@]}")

      - name: Render and assert Orka chart contracts
        run: |
          set -euo pipefail
          helm template orka "$chart" \
            --namespace orka-system \
            --values deploy/orka/values.yaml > "$RUNNER_TEMP/orka-rendered.yaml"
          rendered="$RUNNER_TEMP/orka-rendered.yaml"
          grep -Fq 'agentruntimes' "$rendered"
          grep -Fq 'substrateactorpools' "$rendered"
          grep -Fq 'ghcr.io/orka-agents/orka/ai-worker:0.1.1' "$rendered"
          grep -Fq 'ghcr.io/orka-agents/orka/general-worker:0.1.1' "$rendered"
          grep -Fq 'ghcr.io/orka-agents/orka/agent-harness-wrapper:0.1.1' "$rendered"
          if grep -E 'image: .*:(main|latest)(["[:space:]]|$)' "$rendered"; then
            echo 'rendered Orka chart uses a mutable image tag' >&2
            exit 1
          fi

      - name: Check Orka scripts and repository boundaries
        run: |
          set -euo pipefail
          for script in deploy/orka/*.sh; do
            bash -n "$script"
          done
          if git ls-files | grep -Ei '(^|/)(kubeconfig|.*\.kubeconfig)$'; then
            echo 'tracked kubeconfig found' >&2
            exit 1
          fi
          if grep -RIl '^kind:[[:space:]]*Secret[[:space:]]*$' \
            --include='*.yaml' --include='*.yml' . | grep -q .; then
            echo 'committed Kubernetes Secret manifest found' >&2
            exit 1
          fi

      - name: Install kind
        env:
          KIND_VERSION: v0.31.0
          KIND_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -o "$RUNNER_TEMP/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $RUNNER_TEMP/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Verify fresh-install and uninstall CRD lifecycle
        run: |
          set -euo pipefail
          source deploy/orka/lib.sh
          cluster=orka-chart-ci
          kind create cluster --name "$cluster" --wait 90s
          cleanup() {
            kind delete cluster --name "$cluster"
          }
          trap cleanup EXIT
          context="kind-$cluster"
          helm install orka "$chart" \
            --kube-context "$context" \
            --namespace orka-system \
            --create-namespace \
            --values deploy/orka/values.yaml \
            --set controller.replicas=0 \
            --set controller.gateway.enabled=false \
            --set store.persistence.enabled=false \
            --set workers.harnessWrapper.image.repository=registry.k8s.io/pause \
            --set workers.harnessWrapper.image.tag=3.10
          for crd in "${EXPECTED_CRDS[@]}"; do
            kubectl --context "$context" wait \
              --for=condition=Established --timeout=60s "crd/$crd"
          done
          kubectl --context "$context" apply --dry-run=server \
            -f deploy/orka/opencode-agent.yaml >/dev/null
          OPENAI_BASE_URL=http://model.example.invalid/v1 \
          OPENAI_API_KEY=dummy-ci-key \
            deploy/orka/create-agent-secret.sh --context "$context" --yes
          OPENAI_BASE_URL=http://model.example.invalid/v1 \
            deploy/orka/create-agent-secret.sh \
              --context "$context" --no-api-key --yes
          kubectl --context "$context" --namespace orka-system get \
            secret/opencode-credentials -o json | \
            jq -e '(.data | keys) == ["OPENAI_BASE_URL"]' >/dev/null
          source deploy/orka/versions.env
          deploy/orka/upgrade.sh \
            --context "$context" \
            --chart "$chart" \
            --version 0.1.1 \
            --source-commit "$ORKA_MINIMUM_COMMIT" \
            --yes
          helm uninstall orka --kube-context "$context" --namespace orka-system
          for crd in "${EXPECTED_CRDS[@]}"; do
            kubectl --context "$context" get "crd/$crd" >/dev/null
          done
