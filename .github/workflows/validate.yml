name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-orka-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.0.4

      - name: Validate repository and pinned chart
        run: deploy/scripts/validate.sh

      - name: Render supported configurations
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rendered"
          deploy/scripts/render.sh --output "$RUNNER_TEMP/rendered/base.yaml"
          deploy/scripts/render.sh \
            --values deploy/values-actions.yaml \
            --output "$RUNNER_TEMP/rendered/actions.yaml"
          deploy/scripts/render.sh \
            --allow-scheduled \
            --values deploy/values-scheduled.yaml \
            --output "$RUNNER_TEMP/rendered/scheduled.yaml"

      - name: Assert deployment contracts
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/rendered/base.yaml"
          actions="$RUNNER_TEMP/rendered/actions.yaml"
          scheduled="$RUNNER_TEMP/rendered/scheduled.yaml"

          grep -Fq 'suspend: true' "$base"
          grep -Fq 'suspend: false' "$scheduled"
          grep -Fq -- '-analysis-runtime=orka-container' "$base"
          grep -Fq 'automountServiceAccountToken: true' "$base"
          grep -Fq 'name: ORKA_API_TOKEN_FILE' "$base"
          grep -Fq 'value: /var/run/secrets/kubernetes.io/serviceaccount/token' "$base"
          if grep -Eq '^[[:space:]]*- name: ORKA_API_TOKEN$' "$base"; then
            echo 'base render uses a static Orka API token' >&2
            exit 1
          fi
          grep -Fq 'resources: ["tasks"]' "$base"
          grep -Fq 'resources: ["configmaps"]' "$base"
          grep -Fq 'kind: ValidatingAdmissionPolicy' "$base"
          if grep -Fq 'name: ACTIONS_ENABLED' "$base"; then
            echo 'base render enables write actions' >&2
            exit 1
          fi

          grep -Fq 'name: ACTIONS_ENABLED' "$actions"
          grep -Fq 'value: "true"' "$actions"
          grep -Fq 'app.kubernetes.io/component: orka-fix-runtime' "$actions"
          grep -Fq 'name: ORKA_API_TOKEN_FILE' "$actions"
          if grep -Eq '^[[:space:]]*- name: ORKA_API_TOKEN$' "$actions"; then
            echo 'actions render uses a static Orka API token' >&2
            exit 1
          fi

      - name: Assert timeouts, placement, and immutable tags
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path('.')
          project = (root / 'project.yaml').read_text()
          values = (root / 'deploy/values.yaml').read_text()
          actions = (root / 'deploy/values-actions.yaml').read_text()

          def duration_seconds(value):
              total = 0
              for number, unit in re.findall(r'(\d+)([hms])', value):
                  total += int(number) * {'h': 3600, 'm': 60, 's': 1}[unit]
              return total

          ai_timeout = re.search(r'(?m)^  timeout: (\S+)$', project).group(1)
          task_timeout = re.search(r'(?m)^    taskTimeout: (\S+)$', values).group(1)
          if duration_seconds(task_timeout) <= duration_seconds(ai_timeout):
              raise SystemExit('analyzer Task timeout must exceed AI timeout')

          if not re.search(r'(?m)^    nodeSelector:\n      agentpool: \S+$', values):
              raise SystemExit('analyzer placement does not select an agentpool')
          placement = re.search(r'(?ms)^    nodeSelector:\n(?P<body>(?:      .*\n)+)', values).group('body')
          if re.search(r'gpu|nvidia|h100|a100|accelerator', placement, re.I):
              raise SystemExit('analyzer placement targets an accelerator')

          for path, text in [('deploy/values.yaml', values), ('deploy/values-actions.yaml', actions)]:
              for tag in re.findall(r'(?m)^\s*tag:\s*(\S+)\s*$', text):
                  if tag in {'main', 'latest'} or re.fullmatch(r'v\d+', tag):
                      raise SystemExit(f'{path} contains mutable tag {tag}')
                  if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag):
                      raise SystemExit(f'{path} contains non-semver image tag {tag}')
          PY

      - name: Check scripts and repository Secret boundaries
        run: |
          set -euo pipefail
          for script in deploy/scripts/*.sh; do
            bash -n "$script"
          done
          if grep -RIl '^kind:[[:space:]]*Secret[[:space:]]*$' \
            --include='*.yaml' --include='*.yml' . | grep -q .; then
            echo 'Committed Kubernetes Secret manifest found' >&2
            exit 1
          fi
          test ! -e data
          test ! -e deploy/.rendered
          test ! -e deploy/evidence

      - name: Check Markdown links and referenced paths
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import urllib.parse

          root = pathlib.Path('.').resolve()
          errors = []
          link_re = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          for doc in root.rglob('*.md'):
              if '.git' in doc.parts:
                  continue
              for raw in link_re.findall(doc.read_text()):
                  target = raw.strip().split()[0].strip('<>')
                  if not target or target.startswith(('#', 'http://', 'https://', 'mailto:')):
                      continue
                  path_text = urllib.parse.unquote(target.split('#', 1)[0])
                  resolved = (doc.parent / path_text).resolve()
                  try:
                      resolved.relative_to(root)
                  except ValueError:
                      errors.append(f'{doc}: link escapes repository: {target}')
                      continue
                  if not resolved.exists():
                      errors.append(f'{doc}: missing link target: {target}')

          required = [
              'README.md', 'LICENSE', 'AGENTS.md', 'project.yaml',
              'prompts/system.md', 'skills', 'deploy/README.md',
              'deploy/versions.env', 'deploy/values.yaml',
              'deploy/values-actions.yaml', 'deploy/values-scheduled.yaml',
              'deploy/orka/README.md', 'deploy/orka/opencode-agent.yaml',
              'deploy/scripts/preflight.sh', 'deploy/scripts/render.sh',
              'deploy/scripts/install.sh', 'deploy/scripts/create-secrets.sh',
              'deploy/scripts/run-once.sh', 'deploy/scripts/validate.sh',
              'deploy/scripts/verify-live.sh',
          ]
          for name in required:
              if not (root / name).exists():
                  errors.append(f'missing required path: {name}')
          if errors:
              raise SystemExit('\n'.join(errors))
          PY
