image:
  repository: ghcr.io/willie-yao/prow-ai-dashboard
  tag: v1.0.0-beta.6
  pullPolicy: IfNotPresent

mode: cron

persistence:
  enabled: true
  existingClaim: ""
  storageClass: replace-with-rwx-storage-class
  accessMode: ReadWriteMany
  size: 1Gi
  retain: true

ai:
  enabled: true
  api: chat_completions
  endpoint: http://model-service.model-namespace.svc.cluster.local:8000/v1/chat/completions
  model: replace-with-model-id
  existingSecret: dashboard-model
  tokenSecretKey: AI_TOKEN

fetcher:
  schedule: "0 */6 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  buildsPerJob: 10
  workers: 4
  timeout: 180m
  activeDeadlineSeconds: 86400
  backoffLimit: 0
  restartPolicy: Never

analysisRuntime:
  type: orka-container
  orkaContainer:
    namespace: ""
    api: http://orka.orka-system.svc.cluster.local:8080
    apiAuth:
      existingSecret: ""
      tokenKey: token
    maxConcurrentTasks: 2
    pollInterval: 2s
    taskTimeout: 55m
    retries: 1
    image:
      repository: ghcr.io/willie-yao/prow-ai-dashboard/analyzer
      tag: v1.0.0-beta.6
      pullPolicy: IfNotPresent
    modelAuth:
      existingSecret: orka-model
      tokenKey: token
    state:
      existingSecret: ""
      key: state-key
    nodeSelector:
      agentpool: replace-with-cpu-agentpool
    tolerations: []
    affinity: {}

server:
  chat:
    enabled: true
    timeout: 30m
  actions:
    enabled: false
    mode: oauth
    admins:
      - replace-with-github-login
    oauth:
      clientId: replace-with-oauth-client-id
      redirectUrl: https://capz-orka-demo.example.com/api/auth/callback
      existingSecret: dashboard-oauth
  service:
    type: ClusterIP
    port: 80

orka:
  namespace: orka-system
  fixRuntime:
    enabled: false
  rbac:
    create: true
    serviceAccountName: ""

ingress:
  enabled: false
